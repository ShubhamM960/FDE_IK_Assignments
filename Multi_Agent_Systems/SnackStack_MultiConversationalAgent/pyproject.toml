[project]
name = "snackstack-agent"
version = "0.1.0"
description = "SnackStack Multi-Agent Conversational System (menu + order agents with RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core AI / orchestration
    "openai>=1.40",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.3",
    # RAG
    "chromadb>=0.5",
    "langchain-chroma>=0.2",
    # Config / schemas
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    # Voice I/O (for snackstack/voice)
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[project.scripts]
snackstack = "snackstack.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snackstack"]